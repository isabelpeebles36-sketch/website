<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="QYZVYB_hf7Go0VxZp4NMaKWD9u6e9tmtTFc7pKYPqeM">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Piece — Isabel Peebles</title>
<meta name="description" content="A piece by Isabel Peebles.">
<link rel="canonical" href="https://isabelpeebles36-sketch.github.io/website/Project.dc.html">
<meta property="og:title" content="Piece — Isabel Peebles">
<meta property="og:description" content="A piece by Isabel Peebles.">
<meta property="og:image" content="https://isabelpeebles36-sketch.github.io/website/assets/apple-touch-icon.png">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#F5F3EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="assets/data.js"></script>
<style>
body { margin: 0; background: #F5F3EE; }
a { color: #0C0C0B; }
a:hover { color: #C2560A; }
@keyframes ip-wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes ip-wipe-up { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
</style>
</helmet>

<div style="margin:0;background:#F5F3EE;color:#0C0C0B;font-family:'Helvetica Neue',Helvetica,'Inter',Arial,sans-serif;font-size:16px;line-height:1.6;letter-spacing:-0.005em;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;position:relative">

  <svg ref="{{ cursorRef }}" viewBox="0 0 1000 1000" aria-hidden="true" style="display:none"></svg>

  <svg ref="{{ markRef }}" viewBox="0 0 1000 1000" aria-hidden="true" style="position:fixed;left:50%;top:calc(50% + 31px);transform:translate(-50%,-50%);color:#0C0C0B;opacity:0.12;pointer-events:none;z-index:0;overflow:visible"></svg>


  <header style="position:sticky;top:0;z-index:100;background:rgba(245,243,238,0.88);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid #D7D4CB">
    <div style="max-width:1400px;margin:0 auto;padding:0 clamp(16px,5vw,64px);box-sizing:border-box;height:62px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative;z-index:1">
      <a href="Home.dc.html" style="display:flex;align-items:center;gap:9px;font-size:13.5px;letter-spacing:0.01em;color:#0C0C0B;text-decoration:none;font-weight:500;white-space:nowrap;flex:none"><img src="assets/favicon.svg" alt="" style="display:block;width:17px;height:17px">Isabel Peebles</a>
      <nav style="display:flex;align-items:center;gap:clamp(14px,2.6vw,30px)" aria-label="Primary">
        <a href="Home.dc.html" style="display:block;padding:4px 0;transition:transform 0.2s" style-hover="transform:translateY(-2px)"><img src="assets/hand/nav_home.png" alt="Home" style="display:block;height:clamp(13px,3.4vw,17px);width:auto"></a>
        <a href="Work.dc.html" aria-current="page" style="display:block;position:relative;padding:4px 0"><img src="assets/hand/nav_work.png" alt="Work" style="display:block;height:clamp(13px,3.4vw,17px);width:auto"><img src="assets/hand/line.png" alt="" style="position:absolute;left:-4px;bottom:-4px;width:calc(100% + 8px);height:auto;animation:ip-wipe 0.6s ease 0.3s both"></a>
        <a href="About.dc.html" style="display:block;padding:4px 0;transition:transform 0.2s" style-hover="transform:translateY(-2px)"><img src="assets/hand/nav_about.png" alt="About" style="display:block;height:clamp(13px,3.4vw,17px);width:auto"></a>
        <a href="Contact.dc.html" style="display:block;padding:4px 0;transition:transform 0.2s" style-hover="transform:translateY(-2px)"><img src="assets/hand/nav_contact.png" alt="Contact" style="display:block;height:clamp(13px,3.4vw,17px);width:auto"></a>
      </nav>
    </div>
  </header>

  <main style="flex:1 0 auto;position:relative;z-index:1">
    <div style="width:100%;max-width:1240px;margin:0 auto;padding:0 clamp(20px,5vw,64px);box-sizing:border-box">
      <div style="padding:clamp(30px,4.4vw,58px) 0 clamp(40px,6vw,76px)">

        <sc-if value="{{ hasPiece }}" hint-placeholder-val="{{ false }}">
          <a href="{{ backHref }}" style="display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#6E6C64;text-decoration:none" style-hover="color:#0C0C0B">&larr;&nbsp; {{ backLabel }}</a>

          <div style="display:grid;grid-template-columns:1.25fr 0.75fr;gap:clamp(28px,5vw,64px);align-items:start;margin-top:30px">
            <div>
              <div style="display:flex;align-items:center;justify-content:center">
                <sc-if value="{{ mainImage }}" hint-placeholder-val="{{ false }}">
                  <img src="{{ mainImage }}" alt="{{ piece.title }}" style="max-width:100%;height:auto;display:block;margin:0 auto">
                </sc-if>
                <sc-if value="{{ noImage }}">
                  <div style="padding:60px 20px;text-align:center;width:100%;background:#F2EFE6;border-radius:14px">
                    <p style="font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;color:#6F6D66;margin:0">Image to come</p>
                  </div>
                </sc-if>
              </div>

              <sc-if value="{{ hasMultiplePics }}" hint-placeholder-val="{{ false }}">
                <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px" role="group" aria-label="Other views of this work">
                  <sc-for list="{{ pics }}" as="pic" hint-placeholder-count="3">
                    <button onClick="{{ pic.select }}" aria-pressed="{{ pic.active }}" style="{{ pic.thumbStyle }}">
                      <img src="{{ pic.src }}" alt="{{ pic.alt }}" style="width:100%;height:100%;object-fit:cover;display:block">
                    </button>
                  </sc-for>
                </div>
                <p style="margin:10px 0 0;min-height:1.3em;font-size:13px;color:#6E6C64">{{ activeCaption }}</p>
              </sc-if>
            </div>

            <div>
              <p style="font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;color:#6E6C64;margin:0">{{ kindLabel }}</p>
              <h1 style="font-size:clamp(25px,3.2vw,39px);line-height:1.08;letter-spacing:-0.035em;font-weight:500;margin:6px 0 0">{{ piece.title }}</h1>
              <p style="font-size:13px;line-height:1.6;color:#6E6C64;margin:8px 0 0">{{ metaLine }}</p>
              <div style="margin-top:22px;color:#6E6C64;font-size:15.5px;line-height:1.72">
                <sc-for list="{{ descParas }}" as="para" hint-placeholder-count="2">
                  <p style="margin:0 0 14px">{{ para.text }}</p>
                </sc-for>
              </div>
            </div>
          </div>

          <nav style="display:flex;justify-content:space-between;gap:20px;margin-top:clamp(48px,7vw,80px);padding-top:22px;border-top:1px solid #D7D4CB;font-size:14px" aria-label="Between works">
            <a href="{{ prevHref }}" style="color:#6E6C64;text-decoration:none" style-hover="color:#0C0C0B">&larr;&nbsp; {{ prevTitle }}</a>
            <span style="color:#6F6D66">{{ posLabel }}</span>
            <a href="{{ nextHref }}" style="color:#6E6C64;text-decoration:none" style-hover="color:#0C0C0B">{{ nextTitle }} &nbsp;&rarr;</a>
          </nav>
        </sc-if>

      </div>
    </div>
  </main>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { all: [], pieceCount: 0, idx: 0, activePic: 0 };
    this.cursorRef = React.createRef();
    this.markRef = React.createRef();
  }

  siteData() {
    if (window.SITE_DATA) return Promise.resolve(window.SITE_DATA);
    return new Promise(resolve => {
      const t = setInterval(() => {
        if (window.SITE_DATA) { clearInterval(t); resolve(window.SITE_DATA); }
      }, 30);
    });
  }
  async componentDidMount() {
    const data = await this.siteData();
    this.pictures = data.pictures;
    this.cover = data.cover;
    const all = data.PIECES.concat(data.PROJECTS);
    this.setState({ all, pieceCount: data.PIECES.length }, () => this.syncFromHash());
    window.addEventListener('hashchange', this.onHash = () => this.syncFromHash());
    this.buildCursorMark(this.cursorRef.current);
    this.drawLiveMark(this.markRef.current);
    this.sizeLiveMark();
    window.addEventListener('resize', this.onMarkResize = () => this.sizeLiveMark());
    const cursor = this.cursorRef.current;
    if (cursor) {
      // one compositor-only write per frame instead of one per mousemove event
      this.mx = 0; this.my = 0;
      this.paintCursor = () => {
        cursor.style.transform = 'translate(-50%,-50%) translate3d(' + this.mx + 'px,' + this.my + 'px,0)';
        cursor.style.opacity = '1';
      };
      this.onMove = e => {
        this.mx = e.clientX; this.my = e.clientY;
        if (this.moveRaf) return;
        this.moveRaf = requestAnimationFrame(() => { this.moveRaf = 0; this.paintCursor(); });
      };
      this.onLeave = () => { cursor.style.opacity = '0'; };
      document.addEventListener('mousemove', this.onMove, { passive: true });
      document.addEventListener('mouseleave', this.onLeave);
    }
  }
  // The same live diamond the home-page scroll lands on, held as a constant backdrop.
  drawLiveMark(svg) {
    if (!svg) return;
    const NS = 'http://www.w3.org/2000/svg';
    const R = 460, CX = 500, CY = 500, N = 10, K = 0.54;
    const QUADS = ['ur', 'ul', 'lr', 'll'];
    svg.innerHTML = '';
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('fill', 'none'); g.setAttribute('stroke', 'currentColor');
    g.setAttribute('stroke-width', '1.5'); g.setAttribute('opacity', '0.92');
    svg.appendChild(g);
    const pool = [];
    QUADS.forEach(() => { for (let i = 0; i <= N; i++) { const l = document.createElementNS(NS, 'line'); g.appendChild(l); pool.push(l); } });
    const render = s => {
      let idx = 0;
      QUADS.forEach((q, qi) => {
        const sx = (q === 'ur' || q === 'lr') ? 1 : -1;
        const sy = (q === 'ur' || q === 'ul') ? -1 : 1;
        const tMin = 70 + Math.sin(s * 0.42 + qi * 1.57) * 26 + Math.sin(s * 0.71 + qi * 0.9) * 9;
        const sc = tMin * R, r = Math.pow(R / tMin, 1 / N);
        for (let i = 0; i <= N; i++) {
          const t = tMin * Math.pow(r, i), l = pool[idx++];
          l.setAttribute('x1', (CX + sx * t).toFixed(1)); l.setAttribute('y1', CY);
          l.setAttribute('x2', CX); l.setAttribute('y2', (CY + sy * (sc / t)).toFixed(1));
        }
      });
      const spin = -(s * 1.6 + Math.sin(s * 0.31) * 9), scale = K * (1 + Math.sin(s * 0.53) * 0.05);
      g.setAttribute('transform', 'rotate(' + spin.toFixed(2) + ' ' + CX + ' ' + CY + ') translate(' + CX + ' ' + CY + ') scale(' + scale.toFixed(3) + ') translate(' + (-CX) + ' ' + (-CY) + ')');
    };
    render(0);
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let t0 = null, lastPaint = -999;
    // 30fps cap + skip while the tab is hidden: the mark is decorative, and a 120Hz
    // display would otherwise burn 4x the attribute writes for no visible gain.
    const tick = now => {
      if (t0 === null) t0 = now;
      if (!document.hidden && now - lastPaint >= 32) { lastPaint = now; render((now - t0) / 1000); }
      svg._raf = requestAnimationFrame(tick);
    };
    svg._raf = requestAnimationFrame(tick);
  }
  sizeLiveMark() {
    const svg = this.markRef.current;
    if (!svg) return;
    const field = Math.min(Math.max(320, window.innerHeight - 62) / 1.16, window.innerWidth * 0.84);
    const box = Math.round(field * 1.4004);
    svg.style.width = box + 'px';
    svg.style.height = box + 'px';
  }
  buildCursorMark(svg) {
    if (!svg) return;
    const NS = 'http://www.w3.org/2000/svg';
    const R = 460, CX = 500, CY = 500, N = 10;
    const QUADS = ['ur', 'ul', 'lr', 'll'];
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('fill', 'none'); g.setAttribute('stroke', 'currentColor'); g.setAttribute('stroke-width', '2.4');
    svg.appendChild(g);
    QUADS.forEach(q => {
      const sx = (q === 'ur' || q === 'lr') ? 1 : -1;
      const sy = (q === 'ur' || q === 'ul') ? -1 : 1;
      const tMin = 90, sc = tMin * R, r = Math.pow(R / tMin, 1 / N);
      for (let i = 0; i <= N; i++) {
        const t = tMin * Math.pow(r, i);
        const l = document.createElementNS(NS, 'line');
        l.setAttribute('x1', (CX + sx * t).toFixed(1)); l.setAttribute('y1', CY);
        l.setAttribute('x2', CX); l.setAttribute('y2', (CY + sy * (sc / t)).toFixed(1));
        g.appendChild(l);
      }
    });
  }
  componentWillUnmount() {
    if (this.onMove) document.removeEventListener('mousemove', this.onMove);
    if (this.onLeave) document.removeEventListener('mouseleave', this.onLeave);
    if (this.moveRaf) cancelAnimationFrame(this.moveRaf);
    window.removeEventListener('hashchange', this.onHash);
  }
  syncFromHash() {
    const slug = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    let idx = this.state.all.findIndex(p => p.slug === slug);
    if (idx < 0) idx = 0;
    this.setState({ idx, activePic: 0 });
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  renderVals() {
    const all = this.state.all;
    if (!all.length) return { hasPiece: false };
    const idx = this.state.idx;
    const piece = all[idx];
    const isPiece = idx < this.state.pieceCount;
    const prev = all[(idx - 1 + all.length) % all.length];
    const next = all[(idx + 1) % all.length];
    const pics = this.pictures(piece);
    const activePic = Math.min(this.state.activePic, Math.max(pics.length - 1, 0));
    const meta = [piece.year, piece.medium, piece.dimensions, piece.client, piece.role].filter(Boolean);
    const desc = Array.isArray(piece.description) ? piece.description : [piece.description];

    return {
      hasPiece: true,
      cursorRef: this.cursorRef,
      markRef: this.markRef,
      backHref: isPiece ? 'Work.dc.html' : 'Work.dc.html#projects',
      backLabel: isPiece ? 'All pieces' : 'All projects',
      kindLabel: isPiece ? 'Piece' : 'Project',
      piece,
      mainImage: pics.length ? pics[activePic].src : '',
      noImage: !pics.length,
      hasMultiplePics: pics.length > 1,
      metaLine: meta.join('  ·  '),
      descParas: desc.map(text => ({ text })),
      pics: pics.map((pic, k) => ({
        src: pic.src, alt: pic.caption || (piece.title + ', view ' + (k + 1)),
        active: k === activePic,
        thumbStyle: `width:74px;height:74px;padding:0;border-radius:5px;overflow:hidden;background:#F2EFE6;border:1px solid ${k === activePic ? '#0C0C0B' : 'transparent'};opacity:${k === activePic ? 1 : 0.5};cursor:pointer;transition:opacity 0.25s,border-color 0.25s`,
        select: () => this.setState({ activePic: k })
      })),
      activeCaption: pics.length ? (pics[activePic].caption || '') : '',
      prevHref: '#' + prev.slug, nextHref: '#' + next.slug,
      prevTitle: prev.title, nextTitle: next.title,
      posLabel: (idx + 1) + ' / ' + all.length
    };
  }
}

</script>
</body>
</html>
